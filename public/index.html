/* ================= FOOTER ================= */
.ft{background:#f3f6fb;border-top:1px solid var(--line);padding:12px 0}
.ft-in{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;gap:24px}
.ft-note{margin:0;font-size:12px;color:#7b879c;line-height:1.85}
.ft-links{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:flex-end;align-content:flex-start;max-width:560px}
.ft-links a{font-size:12.5px;color:#4a5872;white-space:nowrap}
.ft-links a:hover{color:var(--navy);text-decoration:underline}

/* ================= 개인정보 동의 팝업 ================= */
.pv{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(8,26,55,.6)}
.pv.on{display:flex}
.pv-box{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 30px 70px rgba(0,0,0,.35);overflow:hidden}
.pv-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.pv-hd h3{margin:0;font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.03em;line-height:1.4}
.pv-x{border:0;background:#f1f4f9;width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;
  font-size:18px;color:#5a6a86;line-height:1;display:grid;place-items:center}
.pv-x:hover{background:#e5eaf3;color:var(--navy)}
.pv-body{padding:20px 24px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pv-intro{margin:0 0 16px;font-size:14.5px;color:#42536f;line-height:1.7}
.pv-tb{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px}
.pv-tb th,.pv-tb td{border:1px solid #e2e8f2;padding:11px 13px;text-align:left;line-height:1.6}
.pv-tb th{background:#f5f8fc;color:var(--navy);font-weight:700;white-space:nowrap;width:34%}
.pv-tb thead th{text-align:center;width:auto}
.pv-tb td{color:#3f4d66}
.pv-sec{margin-bottom:16px}
.pv-sec h4{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--navy)}
.pv-sec p{margin:0;font-size:14px;color:#4a5872;line-height:1.75}
.pv-note{margin:0;padding:13px 15px;background:#f6f8fc;border-radius:9px;font-size:13.5px;color:#5a6a86;line-height:1.7}
.pv-ft{padding:14px 24px 18px;border-top:1px solid var(--line)}
.pv-ft button{width:100%;height:50px;border:0;border-radius:10px;background:var(--navy);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer}
.pv-ft button:hover{background:#0f2d5c}
body.pv-open{overflow:hidden}
/* 약관 팝업 본문 */
.doc-eff{margin:0 0 18px;padding:9px 13px;background:#f5f8fc;border-radius:8px;
  font-size:13px;color:#5a6a86;display:inline-block}
.doc-sec{margin-bottom:20px}
.doc-sec:last-child{margin-bottom:0}
.doc-sec h4{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.doc-sec p{margin:0 0 7px;font-size:14px;color:#4a5872;line-height:1.8}
.doc-sec ol{margin:6px 0 0;padding-left:20px}
.doc-sec ol li{font-size:14px;color:#4a5872;line-height:1.8;margin-bottom:6px}
.doc-sec ol li::marker{color:#8b97ac;font-weight:600}
.doc-intro{margin:0 0 20px;padding:14px 16px;background:#f6f8fc;border-radius:9px;
  font-size:13.5px;color:#4a5872;line-height:1.8}
.doc-sub{margin:12px 0 0;padding:12px 14px;background:#f8fafd;border-radius:8px;border:1px solid #eef2f8}
.doc-sub b{display:block;margin-bottom:6px;font-size:13.5px;color:var(--navy)}
.doc-sub p{margin:0 0 5px;font-size:13.5px}
.doc-sub p:last-child{margin-bottom:0}
.doc-links{margin:10px 0 0;padding:0;list-style:none;counter-reset:dl}
.doc-links li{counter-increment:dl;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;
  padding:9px 0;border-bottom:1px solid #eef2f8;font-size:13.5px}
.doc-links li:last-child{border-bottom:0}
.doc-links li::before{content:counter(dl) ".";color:#8b97ac;font-weight:600;flex:none}
.dl-name{color:var(--navy);font-weight:700}
.doc-links a{color:#1e6fc4;text-decoration:underline;word-break:break-all}
.doc-links a.dl-tel{color:#4a5872;text-decoration:none;white-space:nowrap}

/* ================= TOAST ================= */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:100;
  background:var(--navy);color:#fff;padding:14px 22px;border-radius:12px;font-size:14.5px;
  box-shadow:0 14px 40px rgba(0,0,0,.3);transition:.28s;max-width:88vw;text-align:center;
}
.toast.on{transform:translate(-50%,0)}
.toast.err{background:#b3271e}

/* ================= 편집 모드 (관리자 전용) ================= */
.ed-fab,.ed-panel{display:none}          /* 기본: 일반 방문자에게 숨김 */
body.admin .ed-fab{display:block}
body.admin .ed-panel.on{display:block}
.ed-fab{
  position:fixed;right:18px;bottom:18px;z-index:90;border:0;border-radius:999px;cursor:pointer;
  background:var(--navy);color:#fff;font-size:14px;font-weight:700;padding:12px 18px;
  box-shadow:0 8px 24px rgba(11,34,71,.32);opacity:.9;
}
.ed-fab:hover{opacity:1}
/* 관리자 로그인 오버레이 */
.gate{position:fixed;inset:0;z-index:120;background:rgba(8,26,55,.72);display:grid;place-items:center;padding:20px}
.gate-box{background:#fff;border-radius:14px;padding:26px 24px;width:340px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.gate-box h3{margin:0 0 6px;font-size:17px;color:var(--navy)}
.gate-box p{margin:0 0 16px;font-size:12.5px;color:var(--sub);line-height:1.6}
.gate-box input{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:15px;font-family:inherit}
.gate-box .err{color:#c0392b;font-size:12.5px;margin:8px 0 0;display:none}
.gate-acts{display:flex;gap:8px;margin-top:14px}
.gate-acts button{flex:1;height:44px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy)}
.gate-acts button.pri{background:var(--navy);color:#fff}
.ed-fab.on{background:var(--gold);color:#1b1405}
.ed-panel{
  position:fixed;right:18px;bottom:74px;z-index:91;width:360px;max-width:calc(100vw - 36px);
  max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 50px rgba(11,34,71,.24);padding:18px;display:none;
}
.ed-panel h3{margin:0 0 6px;font-size:15px;color:var(--navy)}
.ed-panel p.hint{margin:0 0 14px;font-size:12.5px;color:var(--sub);line-height:1.6}
.ed-panel label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.ed-panel input,.ed-panel textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit}
.ed-panel textarea{height:150px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5}
.ed-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ed-acts button{flex:1 1 46%;height:38px;border-radius:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:13px;font-weight:700;cursor:pointer}
.ed-acts button.pri{background:var(--navy);color:#fff}
.ed-acts button.warn{border-color:#c33;color:#c33}
body.editing [data-k]{outline:1.5px dashed rgba(200,162,74,.85);outline-offset:2px;border-radius:3px;cursor:text}
body.editing [data-k]:focus{outline:2px solid var(--gold);background:rgba(200,162,74,.12)}
body.editing a{pointer-events:none}

/* ================= RESPONSIVE ================= */
@media (max-width:1180px){
  .hero{grid-template-columns:1fr 1fr;gap:24px}
  .h-title{font-size:44px}
  .h-feats{margin-top:24px}
}

@media (max-width:900px){
  /* ── 모바일: 스크롤 없이 한 화면에 담기 ── */
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100dvh}
  .stage{min-height:0}

  .hd-in{padding:7px 14px;gap:8px}
  .gov{gap:6px}
  .gov a{padding:5px 6px}
  .gov img,.gov svg{height:20px;width:20px}
  .gov .gsub{display:none}
  .gov-div,.hd-badge{display:none}
  .logo-mark{width:26px;height:30px}
  .logo-txt .en{font-size:15px}
  .logo-txt .ko{font-size:10px}

  .hero{grid-template-columns:1fr;gap:12px;padding:12px 14px 10px;align-content:start}
  .h-badge{padding:4px 12px;font-size:12.5px}
  .h-title{font-size:30px;line-height:1.22;margin-top:10px}
  .h-feats{margin-top:12px}
  .h-feat{padding:0 3px}
  .h-ico{width:36px;height:36px;margin-bottom:6px}
  .h-ico svg{width:19px;height:19px}
  .h-feat .t1{font-size:11px;line-height:1.3}
  .h-feat .t2{display:none}

  .panels{max-height:none;flex:1;gap:8px}
  .tabs{display:flex}
  .tabs button{height:32px;font-size:12.5px}
  .panel{border-radius:11px}
  .panel.pf,.panel.nt{flex:1}
  .panels.tab-1 .panel.nt{display:none}
  .panels.tab-2 .panel.pf{display:none}
  .panel-hd{padding:8px 10px;font-size:12.5px}
  .pf-tb{font-size:11px}
  .pf-tb th{padding:6px 3px}
  .pf-tb td{padding:6px 3px}
  .pf-tb td.nm{padding-left:7px}
  .nt-body{padding:11px 13px}
  .nt-body p{font-size:11.5px;line-height:1.7;margin-bottom:8px}

  .cta{padding:14px 14px 16px}
  .cta-title{font-size:14.5px;margin-bottom:11px;line-height:1.45}
  .cta-form{grid-template-columns:1fr 1fr;gap:8px}
  .cta-form input{height:46px;font-size:15px;padding:0 13px}
  .cta-btn{grid-column:1/-1;height:50px;font-size:17px}
  .cta-consents{gap:6px 12px;margin-top:10px}
  .cta-consents .chk{font-size:11.5px}
  .cta-consents .chk .box{width:16px;height:16px}
  .cc-view{font-size:11px}
  .cc-div{display:none}

  .ft{padding:9px 0}
  .ft-in{flex-direction:column;gap:6px;padding:0 14px;text-align:center}
  .ft-note{font-size:9.5px;line-height:1.65}
  .ft-links{justify-content:center;gap:4px 12px;max-width:none}
  .ft-links a{font-size:10.5px}

  .pv{padding:0;align-items:flex-end}
  .pv-box{max-width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  .pv-hd{padding:18px 18px 14px}
  .pv-hd h3{font-size:16.5px}
  .pv-body{padding:16px 18px 20px}
  .pv-intro{font-size:13.5px}
  .pv-tb{font-size:13px}
  .pv-tb th,.pv-tb td{padding:9px 10px}
  .doc-sec h4{font-size:14.5px}
  .doc-sec p,.doc-sec ol li{font-size:13.5px;line-height:1.75}
  .ed-fab{bottom:12px;right:12px;padding:10px 14px;font-size:13px}
  .ed-panel{bottom:64px;right:12px}
}

@media (max-width:420px){
  .h-title{font-size:26px}
  .h-feat .t1{font-size:10px}
  .pf-tb{font-size:10.5px}
  .cta-title{font-size:13px}
}

/* ── 모바일 한 화면 맞춤: 각 구간을 압축해 표에 공간을 준다 ── */
@media (max-width:900px){
  .hd-in{padding:6px 12px;gap:8px}
  .logo-mark{width:22px;height:26px}
  .logo-txt .en{font-size:13.5px}
  .logo-txt .ko{font-size:9px}
  .gov{flex:1;min-width:0;justify-content:flex-end;gap:5px}
  .gov a,.gov a.has-img{padding:4px 5px;border-radius:8px}
  .gov-logo{width:auto;flex:1 1 auto;min-width:0;height:20px}

  .hero{padding:10px 13px 8px;gap:9px}
  .h-badge{padding:3px 11px;font-size:12px}
  .h-title{font-size:27px;margin-top:8px;line-height:1.2}
  .h-feats{margin-top:10px}
  .h-ico{width:32px;height:32px;margin-bottom:5px}
  .h-ico svg{width:17px;height:17px}
  .h-feat .t1{font-size:10.5px}

  .cta{padding:11px 13px 12px}
  .cta-title{font-size:13.5px;margin-bottom:9px;line-height:1.4}
  .cta-form{gap:7px}
  .cta-form input{height:44px;font-size:14.5px;padding:0 12px}
  .cta-btn{height:46px;font-size:16px}
  .cta-consents{gap:5px 10px;margin-top:8px}
  .cta-consents .chk{font-size:11px}
  .cta-consents .chk .box{width:15px;height:15px}

  .ft{padding:6px 0}
  .ft-in{gap:4px;padding:0 12px}
  .ft-note{font-size:9px;line-height:1.5}
  .ft-links{gap:3px 10px}
  .ft-links a{font-size:9.5px}
}

/* ── 2차 압축: 표(추천종목 내역)에 최대한 공간 배분 ── */
@media (max-width:900px){
  .h-title{font-size:24px;line-height:1.18;margin-top:7px}
  .h-badge{padding:2px 10px;font-size:11.5px}
  .h-feats{margin-top:8px}
  .h-ico{width:30px;height:30px;margin-bottom:4px}
  .h-ico svg{width:16px;height:16px}
  .h-feat .t1{font-size:10px;line-height:1.25}
  .hero{padding:8px 12px 6px;gap:8px}

  .tabs button{height:29px;font-size:12px}
  .panels{gap:6px}
  .panel-hd{padding:6px 9px;font-size:11.5px}

  .cta{padding:9px 12px 10px}
  .cta-title{font-size:13px;margin-bottom:8px;line-height:1.35}
  .cta-form input{height:42px}
  .cta-btn{height:44px;font-size:15.5px}
  .cta-consents{gap:4px 9px;margin-top:7px}

  .ft{padding:5px 0}
  .ft-note{font-size:8.5px;line-height:1.45}
  .ft-links{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:10px;padding-bottom:2px}
  .ft-links::-webkit-scrollbar{display:none}
  .ft-links a{font-size:9.5px;flex:none}
}

/* ── 3차: 표 행을 촘촘히 하고 헤드라인을 더 줄여 표를 넓게 ── */
@media (max-width:900px){
  .h-title{font-size:22px;line-height:1.16;margin-top:6px}
  .h-ico{width:28px;height:28px;margin-bottom:3px}
  .h-ico svg{width:15px;height:15px}
  .h-feat .t1{font-size:9.5px}
  .h-feats{margin-top:7px}

  .pf-tb{font-size:10px}
  .pf-tb th{padding:5px 2px}
  .pf-tb td{padding:4px 2px}
  .pf-tb td.nm{padding-left:6px}
  .nt-body p{font-size:11px;margin-bottom:7px}

  .cta-title{font-size:12.5px;margin-bottom:7px}
  .ft-note{font-size:8px}
}

/* 화면이 아주 낮은 기기(가로 모드 등)에서는 스크롤 허용 */
@media (max-width:900px) and (max-height:560px){
  body{min-height:auto}
  .panels{min-height:260px}
}

<body>

<!-- ===== HEADER ===== -->
<header class="hd">
  <div class="hd-in">
    <a class="logo" href="#top">
      <svg class="logo-mark" viewBox="0 0 40 46" fill="none" aria-hidden="true">
        <path d="M4 4v38M28 4v38M4 23h24" stroke="#0b2247" stroke-width="4" stroke-linecap="square"/>
        <path d="M34 6v34" stroke="#c8a24a" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <span class="logo-txt">
        <span class="en" data-k="brand.en">HODU INVEST</span>
        <span class="ko" data-k="brand.ko">호두인베스트</span>
      </span>
    </a>
    <nav class="gov" id="govLinks" aria-label="관련 기관 바로가기"></nav>
  </div>
</header>

<main class="stage" id="top">
  <!-- ===== 첫 화면 ===== -->
  <section class="hero">
    <div class="hero-left">
      <span class="h-badge">[ <i></i> <span data-k="hero.badge">실시간</span> ]</span>
      <h1 class="h-title">
        <span data-k="hero.t1">당일 급등</span><br>
        <span class="gold" data-k="hero.t2">예상종목</span><br>
        <span data-k="hero.t3">매일 받아보세요</span>
      </h1>
      <div class="h-feats" id="heroFeats"></div>
    </div>

    <!-- 추천종목 내역 / 수익률 기준 안내 -->
    <div class="panels tab-1" id="panels">
      <div class="tabs" id="panelTabs">
        <button type="button" class="on" data-tab="1" data-k="panels.tab1">추천종목 내역</button>
        <button type="button" data-tab="2" data-k="panels.tab2">수익률 기준 안내</button>
      </div>

        <div class="cta-consents" id="consents"></div>

</main>

</div>

<!-- 개인정보 수집·이용 동의 팝업 -->
<div class="pv" id="pvModal" role="dialog" aria-modal="true" aria-labelledby="pvTitle">
  <div class="pv-box">
    <div class="pv-hd">
      <h3 id="pvTitle" data-k="privacy.title">개인정보 수집·이용 및 상담 연락 동의</h3>
      <button class="pv-x" type="button" id="pvClose" aria-label="닫기">✕</button>
    </div>
    <div class="pv-body">
      <p class="pv-intro" data-k="privacy.intro"></p>
      <table class="pv-tb"><thead id="pvThead"></thead><tbody id="pvTbody"></tbody></table>
      <div id="pvSections"></div>
      <p class="pv-note" data-k="privacy.note"></p>
    </div>
    <div class="pv-ft"><button type="button" id="pvOk" data-k="privacy.close">확인</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 편집 모드 UI -->
<button class="ed-fab" id="edFab" type="button">✏ 내용편집</button>
<div class="ed-panel" id="edPanel">
  <h3>내용 편집 모드</h3>
  <p class="hint">페이지의 <b>글자를 직접 클릭해서</b> 고칠 수 있습니다.<br><b>사이트에 반영</b>을 눌러야 실제 방문자 화면에 적용됩니다. (누르지 않고 창을 닫으면 사라집니다)</p>
  <div id="urlFields"></div>
  <label>고급 · 전체 내용(JSON) 직접 수정</label>
  <textarea id="jsonBox" spellcheck="false"></textarea>
  <div class="ed-acts">
    <button type="button" class="pri" id="btnPublish" style="flex:1 1 100%">사이트에 반영</button>
    <button type="button" id="btnApplyJson">JSON 적용</button>
    <button type="button" id="btnCopy">JSON 복사</button>
    <button type="button" id="btnSaveHtml">HTML 백업</button>
    <button type="button" class="warn" id="btnReset">처음 문구로</button>
  </div>
</div>

<script>
/* ============================================================
   1) 저장된 편집 내용 불러오기
   ============================================================ */
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG));
let editing = false;          // 편집 모드 on/off
let dirty = false;            // 저장(반영) 안 된 편집이 있는지
let C = CONFIG;

function deepMerge(base, over) {
  if (Array.isArray(over)) return over;
  if (over && typeof over === "object") {
    for (const k in over) base[k] = deepMerge(base[k] ?? (Array.isArray(over[k]) ? [] : {}), over[k]);
    return base;
  }
  return over === undefined ? base : over;
}
const get = (p) => p.split(".").reduce((o, k) => (o == null ? o : o[k]), C);
const set = (p, v) => {
  const ks = p.split("."); let o = C;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = v;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const $ = (s) => document.querySelector(s);

/* ============================================================
   2) 렌더링
   ============================================================ */
const ICONS = {
  brief:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M4 19h16"/><path d="M6 15.5l4-4.5 3 3 5-6.5"/><circle cx="18" cy="7.5" r="1.6" fill="#c8a24a" stroke="none"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3.4"/><path d="M12 3.8v2.6M12 17.6v2.6M3.8 12h2.6M17.6 12h2.6" stroke-linecap="round"/></svg>',
  bell:   '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M6.5 17V11a5.5 5.5 0 1111 0v6"/><path d="M4.6 17h14.8" stroke-linecap="round"/><path d="M10.2 20a2 2 0 003.6 0" stroke-linecap="round"/></svg>',
  clip:   '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="2.2"/><path d="M9 3h6v3H9z" fill="#c8a24a" stroke="none"/><path d="M8.6 11.5h6.8M8.6 15.2h4.4" stroke-linecap="round"/></svg>'
};
const CHK = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';

function govMark(key) {
  if (key === "fine") return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e8f7ec"/><circle cx="12" cy="12" r="10" fill="none" stroke="#22a04a" stroke-width="1.6"/><path d="M2.4 12h19.2M12 2.2c2.6 2.8 3.9 6.2 3.9 9.8S14.6 18.9 12 21.8C9.4 18.9 8.1 15.6 8.1 12S9.4 5 12 2.2z" fill="none" stroke="#22a04a" stroke-width="1.3"/></svg>';
  if (key === "fsc") return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f4f7fc" stroke="#0b2247" stroke-width="1.4"/><path d="M7.5 12a4.5 4.5 0 019 0 4.5 4.5 0 01-9 0z" fill="#c8384a"/><path d="M12 7.5a4.5 4.5 0 010 9 4.5 4.5 0 000-9z" fill="#1d3f8f"/></svg>';
  return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#eaf1fb" stroke="#1e6fc4" stroke-width="1.5"/><path d="M2.6 12h18.8M12 2.3c2.5 2.8 3.8 6.1 3.8 9.7s-1.3 6.9-3.8 9.7C9.5 18.9 8.2 15.6 8.2 12S9.5 5.1 12 2.3z" fill="none" stroke="#1e6fc4" stroke-width="1.2"/></svg>';
}

function render() {
  /* 텍스트 바인딩 */
  document.querySelectorAll("[data-k]").forEach((el) => {
    const v = get(el.dataset.k);
    if (v !== undefined && v !== null) el.textContent = v;
  });

  /* 기관 로고 링크 — 로고 파일이 있으면 그림, 없으면 임시 도형 + 글자 */
  const govText = (g, i) => `
      <span>
        <span class="gnm" data-k="topLinks.${i}.name">${esc(g.name)}</span>
        ${g.sub ? `<span class="gsub" data-k="topLinks.${i}.sub">${esc(g.sub)}</span>` : ""}
      </span>`;
  $("#govLinks").innerHTML = C.topLinks.map((g, i) => `
    ${i > 0 ? '<span class="gov-div"></span>' : ""}
    <a class="${g.img ? "has-img" : ""}" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer" title="${esc(g.name)} 홈페이지">
      ${g.img
        ? `<span class="gov-logo" role="img" aria-label="${esc(g.name)}" data-i="${i}"
                 style="background-image:url('${esc(g.img)}')"></span>`
        : govMark(g.key) + govText(g, i)}
    </a>`).join("") + `<span class="gov-div"></span><button class="hd-badge" type="button" id="fineBadge" data-k="fine.badgeBtn">${esc(C.fine.badgeBtn)}</button>`;
  $("#fineBadge").addEventListener("click", fineOpen);

  /* 로고 파일이 없으면 기존 임시 도형으로 자동 대체 (배경이미지는 onerror 가 없어 미리 확인) */
  $("#govLinks").querySelectorAll(".gov-logo[data-i]").forEach((box) => {
    const i = +box.dataset.i, g = C.topLinks[i];
    const probe = new Image();
    probe.onerror = () => {
      const a = box.closest("a");
      if (!a) return;
      a.classList.remove("has-img");
      a.innerHTML = govMark(g.key) + govText(g, i);
    };
    probe.src = g.img;
  });

  /* 4가지 특징 */
  $("#heroFeats").innerHTML = C.hero.feats.map((f, i) => `
    <div class="h-feat">
      <span class="h-ico">${ICONS[f.icon] || ICONS.brief}</span>
      <span class="t1" data-k="hero.feats.${i}.t1">${esc(f.t1)}</span>
      <span class="t2" data-k="hero.feats.${i}.t2">${esc(f.t2)}</span>
    </div>`).join("");

  /* 추천종목 내역 표 */
  const pf = C.panels.portfolio;
  const rate = (v) => String(v).trim().startsWith("-") ? "dn" : "up";
  $("#pfTable").innerHTML =
    `<thead><tr>${pf.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>` +
    `<tbody>${pf.rows.map((r) => `<tr>` + r.map((v, i) =>
      `<td class="${i === 0 ? "nm" : (i === r.length - 1 ? rate(v) : "")}">${esc(v)}</td>`).join("") +
      `</tr>`).join("")}</tbody>`;

  /* 수익률 기준 안내 */
  $("#ntBody").innerHTML = C.panels.notice.paras.map((t, i) =>
    `<p data-k="panels.notice.paras.${i}">${esc(t)}</p>`).join("");

  /* 신청 폼 */
  $("#f-name").placeholder = C.cta.namePh;
  $("#f-phone").placeholder = C.cta.phonePh;

  /* 동의 체크박스 (모두 동의 + 필수 항목들) */
  const chkBox = `<span class="box">${CHK}</span>`;
  $("#consents").innerHTML =
    `<label class="chk"><input type="checkbox" id="c-all">${chkBox}<span data-k="cta.allLabel">${esc(C.cta.allLabel)}</span></label>
     <span class="cc-div">|</span>` +
    C.cta.consents.map((c, i) => {
      const hasDoc = c.doc && (C.docs || {})[c.doc];
      return `<label class="chk"><input type="checkbox" class="cc" data-i="${i}">${chkBox}<span data-k="cta.consents.${i}.label">${esc(c.label)}</span></label>` +
        (hasDoc ? `<a class="cc-view" href="#" data-doc="${esc(c.doc)}" data-k="cta.viewLabel">${esc(C.cta.viewLabel)}</a>` : "");
    }).join('<span class="cc-div">|</span>');

  const ccList = () => [...document.querySelectorAll("#consents .cc")];
  $("#c-all").addEventListener("change", (e) => ccList().forEach((c) => (c.checked = e.target.checked)));
  ccList().forEach((c) => c.addEventListener("change", () => {
    $("#c-all").checked = ccList().every((x) => x.checked);
  }));
  $("#consents").querySelectorAll("a[data-doc]").forEach((a) => {
    a.addEventListener("click", (e) => { if (editing) return; e.preventDefault(); docOpen(a.dataset.doc); });
  });

  /* 푸터 */
  $("#ftMenu").innerHTML = C.footer.menus.map((m, i) =>
    `<a href="${esc(m.url)}"${m.doc ? ` data-doc="${esc(m.doc)}"` : ""} data-k="footer.menus.${i}.label">${esc(m.label)}</a>`).join("");
  $("#ftMenu").querySelectorAll("a[data-doc]").forEach((a) => {
    a.addEventListener("click", (e) => { if (editing) return; e.preventDefault(); docOpen(a.dataset.doc); });
  });
  $("#ftNote").innerHTML = C.footer.disclaimer.map((d, i) =>
    `<span data-k="footer.disclaimer.${i}">${esc(d)}</span>`).join("<br>");
  if (editing) enableEditing(true);
}
render();

/* 서버에 저장된 문구가 있으면 덮어쓰기 (관리자가 편집·반영한 내용) */
(async () => {
  try {
    const r = await fetch("/api/content", { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d && typeof d === "object" && Object.keys(d).length) {
      C = deepMerge(JSON.parse(JSON.stringify(DEFAULTS)), d);
      render();
      if (editing) syncJson();
    }
  } catch (e) { /* 실패해도 기본 문구로 정상 노출 */ }
})();

/* ============================================================
   3) 폼 동작
   ============================================================ */
const toast = (msg, err) => {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast on" + (err ? " err" : "");
  clearTimeout(t._tid);
  t._tid = setTimeout(() => (t.className = "toast"), 3200);
};

$("#f-phone").addEventListener("input", (e) => {
  const d = e.target.value.replace(/\D/g, "").slice(0, 11);
  e.target.value = d.length < 4 ? d
    : d.length < 8 ? d.slice(0, 3) + "-" + d.slice(3)
    : d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
});
$("#leadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (editing) return toast("편집 모드에서는 신청이 동작하지 않습니다.", true);
  if (e.target.website.value) return;                       // 허니팟

  const name = $("#f-name").value.trim();
  const phone = $("#f-phone").value.replace(/\D/g, "");
  const agreed = [...document.querySelectorAll("#consents .cc")].every((c) => c.checked);

  if (name.length < 2) return toast("이름을 정확히 입력해 주세요.", true);
  if (!/^01[0-9]\d{7,8}$/.test(phone)) return toast("휴대폰 번호를 정확히 입력해 주세요.", true);
  if (!agreed) return toast("필수 동의 항목에 모두 체크해 주세요.", true);

  const payload = { name, phone };

  if (!C.cta.endpoint) { toast(C.cta.demoMsg); console.log("[신청 데이터]", payload); return; }
  try {
    const r = await fetch(C.cta.endpoint, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return toast(d.error || "신청에 실패했습니다. 잠시 후 다시 시도해 주세요.", true);
    toast(C.cta.successMsg);
    e.target.reset();
    $("#c-all").checked = false;
  } catch (err) { toast("네트워크 오류입니다. 잠시 후 다시 시도해 주세요.", true); }
});

/* ── 개인정보 동의 팝업 열기/닫기 ── */
const pvModal = $("#pvModal");
function pvOpen(e) {
  if (e) e.preventDefault();
  if (editing) return;                       // 편집 모드에서는 열지 않음
  pvModal.classList.add("on");
  document.body.classList.add("pv-open");
  $("#pvClose").focus({ preventScroll: true });
}
function pvHide() {
  pvModal.classList.remove("on");
  document.body.classList.remove("pv-open");
}

/* ── 약관 팝업 ─────────────────────────────────────── */
function docOpen(key) {
  const d = (C.docs || {})[key];
  if (!d) return;
  $("#docTitle").textContent = d.title || "";
  const para = (t) => `<p>${esc(t)}</p>`;
  $("#docBody").innerHTML =
    (d.effective ? `<p class="doc-eff">${esc(d.effective)}</p>` : "") +
    (d.intro ? `<p class="doc-intro">${esc(d.intro)}</p>` : "") +
    (d.sections || []).map((sec) => `
      <section class="doc-sec">
        ${sec.h ? `<h4>${esc(sec.h)}</h4>` : ""}
        ${(sec.p || []).map(para).join("")}
        ${(sec.ol || []).length ? `<ol>${sec.ol.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>` : ""}
        ${(sec.sub || []).map((b) => `
          <div class="doc-sub">
            ${b.t ? `<b>${esc(b.t)}</b>` : ""}
            ${(b.p || []).map(para).join("")}
          </div>`).join("")}
        ${(sec.links || []).length ? `<ul class="doc-links">${sec.links.map((l) => `
          <li>
            <span class="dl-name">${esc(l.name)}</span>
            <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a>
            ${l.tel ? `<a class="dl-tel" href="tel:${esc(l.tel.replace(/[^0-9]/g, ""))}">${esc(l.telNote ? l.telNote + " " + l.tel : l.tel)}</a>` : ""}
          </li>`).join("")}</ul>` : ""}
        ${(sec.after || []).map(para).join("")}
      </section>`).join("");
  $("#docBody").scrollTop = 0;
  $("#docModal").classList.add("on");
  document.body.classList.add("pv-open");
}
const docHide = () => { $("#docModal").classList.remove("on"); document.body.classList.remove("pv-open"); };
$("#docX").addEventListener("click", docHide);
$("#docOk").addEventListener("click", docHide);
$("#docModal").addEventListener("click", (e) => { if (e.target.id === "docModal") docHide(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") docHide(); });

/* FINE 캡처 확대 보기 닫기 */
const zoomHide = () => { $("#zoomBox").classList.remove("on"); document.body.classList.remove("pv-open"); };
$("#zoomClose").addEventListener("click", zoomHide);
$("#zoomBox").addEventListener("click", (e) => { if (e.target.id !== "zoomImg") zoomHide(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") zoomHide(); });
$("#pvClose").addEventListener("click", pvHide);
$("#pvOk").addEventListener("click", pvHide);
pvModal.addEventListener("click", (e) => { if (e.target === pvModal) pvHide(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && pvModal.classList.contains("on")) pvHide(); });

/* ── 패널 탭 전환 (모바일) ─────────────────────────── */
$("#panelTabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  $("#panels").className = "panels tab-" + b.dataset.tab;
  $("#panelTabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
});

/* ── 파인(FINE) 등재 확인 팝업 ──────────────────────── */
const fineModal = $("#fineModal");
function fineOpen(e) {
  if (e) e.preventDefault();
  if (editing) return;
  const f = C.fine;
  fineModal.querySelector("#fineBody").innerHTML =
    `<p class="pv-intro" data-k="fine.desc">${esc(f.desc)}</p>` +
    `<table class="pv-tb">${f.rows.map((r, i) => `
      <tr><th data-k="fine.rows.${i}.k">${esc(r.k)}</th>
          <td data-k="fine.rows.${i}.v">${esc(r.v)}</td></tr>`).join("")}</table>` +
    (f.image ? `<div class="fine-shot">
        <button type="button" id="fineZoom" aria-label="크게 보기">
          <img src="${esc(f.image)}" alt="FINE 제도권 금융회사 조회 화면">
        </button>
        <div class="fine-hint" data-k="fine.zoomHint">${esc(f.zoomHint || "")}</div>
      </div>` : "") +
    `<p class="pv-note" data-k="fine.note">${esc(f.note)}</p>` +
    (f.buttons || []).map((b, i) => `<a class="fine-link" href="${esc(b.url)}" target="_blank"
        rel="noopener noreferrer" data-k="fine.buttons.${i}.label">${esc(b.label)}</a>`).join("");

  const shot = fineModal.querySelector(".fine-shot img");
  if (shot) {
    shot.onerror = () => shot.closest(".fine-shot").remove();
    $("#fineZoom").onclick = () => {
      const z = $("#zoomBox"), zi = $("#zoomImg");
      zi.src = shot.src; zi.alt = shot.alt;
      z.classList.add("on");
      const place = () => { z.scrollLeft = Math.max(0, (zi.offsetWidth - z.clientWidth) * 0.62); z.scrollTop = 0; };
      zi.complete ? place() : (zi.onload = place);
    };
  }
  fineModal.classList.add("on");
  document.body.classList.add("pv-open");
}
const fineHide = () => { fineModal.classList.remove("on"); document.body.classList.remove("pv-open"); };
$("#fineX").addEventListener("click", fineHide);
$("#fineOk").addEventListener("click", fineHide);
fineModal.addEventListener("click", (e) => { if (e.target === fineModal) fineHide(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fineHide(); });

/* ============================================================
   4) 편집 모드 — 관리자 인증 후에만 사용 가능
      들어가는 법: 주소 뒤에 ?edit=1 을 붙이고 관리자 비밀번호 입력
      예) https://내사이트.netlify.app/?edit=1
      (일반 방문자에게는 편집 버튼이 아예 보이지 않습니다)
      고친 내용은 "사이트에 반영"을 눌러야 모든 방문자에게 적용됩니다.
   ============================================================ */
const ADMIN_TOKEN_KEY = "hodu_token";   // 관리자 페이지(/admin)와 동일한 세션 키
const save = () => { dirty = true; markDirty(); };

function markDirty() {
  const b = $("#btnPublish");
  if (!b) return;
  b.textContent = dirty ? "● 사이트에 반영" : "사이트에 반영";
  b.style.opacity = dirty ? "1" : ".6";
}

async function tokenValid(t) {
  if (!t) return false;
  try {
    const r = await fetch("/api/admin/me", { headers: { Authorization: "Bearer " + t } });
    return r.ok;
  } catch (e) { return false; }
}

function showGate() {
  const g = document.createElement("div");
  g.className = "gate";
  g.innerHTML = `
    <div class="gate-box">
      <h3>관리자 확인</h3>
      <p>랜딩페이지 내용을 편집하려면 관리자 비밀번호를 입력해 주세요.</p>
      <input type="password" id="gatePw" autocomplete="current-password" placeholder="관리자 비밀번호">
      <p class="err" id="gateErr"></p>
      <div class="gate-acts">
        <button type="button" id="gateCancel">취소</button>
        <button type="button" class="pri" id="gateOk">확인</button>
      </div>
    </div>`;
  document.body.appendChild(g);
  const err = (m) => { const e = $("#gateErr"); e.textContent = m; e.style.display = "block"; };
  const tryLogin = async () => {
    const pw = $("#gatePw").value;
    if (!pw) return err("비밀번호를 입력해 주세요.");
    try {
      const r = await fetch("/api/admin/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.token) return err(d.error || "비밀번호가 일치하지 않습니다.");
      sessionStorage.setItem(ADMIN_TOKEN_KEY, d.token);
      g.remove();
      openEditor();
    } catch (e) { err("서버에 연결할 수 없습니다."); }
  };
  $("#gateOk").onclick = tryLogin;
  $("#gatePw").onkeydown = (e) => { if (e.key === "Enter") tryLogin(); };
  $("#gateCancel").onclick = () => { g.remove(); history.replaceState(null, "", location.pathname); };
  setTimeout(() => $("#gatePw").focus(), 60);
}

async function adminGate() {
  const want = new URLSearchParams(location.search).get("edit") === "1" || location.hash === "#edit";
  if (!want) return;                                   // 일반 방문 → 편집 UI 없음
  if (await tokenValid(sessionStorage.getItem(ADMIN_TOKEN_KEY))) openEditor();
  else showGate();
}

function openEditor() {
  document.body.classList.add("admin");
  buildUrlFields(); syncJson(); markDirty();
  toast("관리자 모드입니다. 우측 하단 버튼으로 편집하세요.");
}
adminGate();

function enableEditing(on) {
  document.body.classList.toggle("editing", on);
  document.querySelectorAll("[data-k]").forEach((el) => {
    if (on) {
      el.setAttribute("contenteditable", "plaintext-only");
      el.oninput = () => { set(el.dataset.k, el.textContent); save(); syncJson(); };
    } else {
      el.removeAttribute("contenteditable");
      el.oninput = null;
    }
  });
}

function urlList() {
  const out = [];
  (function walk(o, p) {
    for (const k in o) {
      const v = o[k], path = p ? p + "." + k : k;
      if (v && typeof v === "object") walk(v, path);
      else if (typeof v === "string" && (k === "url" || k === "img" || k === "endpoint")) out.push([path, v]);
    }
  })(C, "");
  return out;
}
function buildUrlFields() {
  const labelFor = (p) => {
    const m = p.match(/^topLinks\.(\d+)\.url$/); if (m) return C.topLinks[m[1]].name + " 링크";
    const b = p.match(/^fine\.buttons\.(\d+)\.url$/); if (b) return C.fine.buttons[b[1]].label + " 링크";
    const f = p.match(/^footer\.menus\.(\d+)\.url$/); if (f) return "푸터 · " + C.footer.menus[f[1]].label;
    const g = p.match(/^topLinks\.(\d+)\.img$/); if (g) return C.topLinks[g[1]].name + " 로고 파일";
    if (p === "form.endpoint") return "상담신청 전송 주소 (비우면 전송 안 함)";
    return p;
  };
  $("#urlFields").innerHTML = urlList().map(([p, v]) =>
    `<label>${esc(labelFor(p))}</label><input data-url="${esc(p)}" value="${esc(v)}">`).join("");
  $("#urlFields").querySelectorAll("input").forEach((inp) => {
    inp.addEventListener("change", () => { set(inp.dataset.url, inp.value.trim()); save(); render(); syncJson(); buildUrlFields(); });
  });
}
const syncJson = () => { $("#jsonBox").value = JSON.stringify(C, null, 2); };

$("#edFab").addEventListener("click", () => {
  editing = !editing;
  $("#edFab").classList.toggle("on", editing);
  $("#edFab").textContent = editing ? "✓ 편집 종료" : "✏ 내용편집";
  $("#edPanel").classList.toggle("on", editing);
  if (editing) { buildUrlFields(); syncJson(); }
  enableEditing(editing);
});

$("#btnApplyJson").addEventListener("click", () => {
  try {
    C = deepMerge(JSON.parse(JSON.stringify(DEFAULTS)), JSON.parse($("#jsonBox").value));
    save(); render(); buildUrlFields(); toast("화면에 적용했습니다. [사이트에 반영]을 눌러 저장하세요.");
  } catch (e) { toast("JSON 형식이 올바르지 않습니다.", true); }
});

/* 서버에 저장 → 모든 방문자에게 즉시 적용 */
$("#btnPublish").addEventListener("click", async () => {
  const t = sessionStorage.getItem(ADMIN_TOKEN_KEY) || "";
  try {
    const r = await fetch("/api/content", {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + t },
      body: JSON.stringify(C)
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) return toast("로그인이 만료되었습니다. 새로고침 후 다시 로그인해 주세요.", true);
    if (!r.ok) return toast(d.error || "저장에 실패했습니다.", true);
    dirty = false; markDirty();
    toast("사이트에 반영되었습니다. (" + (d.savedAt || "") + ")");
  } catch (e) { toast("서버에 연결할 수 없습니다.", true); }
});

$("#btnCopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(C, null, 2)); toast("JSON을 복사했습니다."); }
  catch (e) { $("#jsonBox").select(); toast("복사 실패 — 직접 선택해 복사해 주세요.", true); }
});

/* 편집 결과가 CONFIG에 반영된 완성 HTML 파일 내려받기 */
$("#btnSaveHtml").addEventListener("click", () => {
  /* 편집 흔적(관리자 모드 클래스·contenteditable)을 뺀 깨끗한 사본을 만든다 */
  const bodyCls = document.body.className;
  document.body.className = "";
  document.querySelectorAll("[data-k]").forEach((el) => el.removeAttribute("contenteditable"));
  const src = document.documentElement.outerHTML;
  document.body.className = bodyCls;
  if (editing) enableEditing(true);

  const start = src.indexOf("const CONFIG = {");
  const end = src.indexOf("\n};", start);
  if (start < 0 || end < 0) return toast("저장에 실패했습니다.", true);
  const out = src.slice(0, start) + "const CONFIG = " + JSON.stringify(C, null, 2) + ";" + src.slice(end + 3);
  const blob = new Blob(["<!DOCTYPE html>\n" + out], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hodu.html";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("hodu.html 파일로 저장했습니다.");
});

$("#btnReset").addEventListener("click", () => {
  if (!confirm("페이지 기본 문구로 되돌릴까요?\n(되돌린 뒤 [사이트에 반영]을 눌러야 실제로 적용됩니다)")) return;
  C = JSON.parse(JSON.stringify(DEFAULTS));
  save(); render(); buildUrlFields(); syncJson();
  toast("기본 문구로 되돌렸습니다. [사이트에 반영]을 눌러 저장하세요.");
});

/* 반영하지 않은 편집이 있으면 이탈 경고 */
addEventListener("beforeunload", (e) => { if (editing && dirty) { e.preventDefault(); e.returnValue = ""; } });
</script>
