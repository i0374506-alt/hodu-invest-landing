# ── 호두인베스트 랜딩페이지 · Netlify 설정 ───────────────────────────
# 정적 파일은 public/ , 서버 기능(API)은 netlify/functions/ 에 있습니다.

[build]
  publish  = "public"
  command  = "npm install --omit=dev"      # 함수용 패키지(@netlify/blobs) 설치
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 어드민 페이지 주소를 /admin 으로도 열 수 있게
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# API 경로 → 함수 연결 (zip 드래그 배포에서도 동작하도록 명시)
[[redirects]]
  from = "/api/leads"
  to   = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/content"
  to   = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to   = "/.netlify/functions/admin/:splat"
  status = 200

# 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# 어드민 페이지는 캐시/색인 금지
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"
