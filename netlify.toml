# ── 호두인베스트 랜딩페이지 · Netlify 설정 ───────────────────────────
# 정적 파일은 public/ , 서버 기능(API)은 netlify/functions/ 에 있습니다.

[build]
  publish  = "public"
  command  = "npm install --omit=dev"      # 함수용 패키지(@netlify/blobs) 설치
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 어드민 페이지 주소를 /admin 으로도 열 수 있게
[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

# API 경로 → 함수 연결 (zip 드래그 배포에서도 동작하도록 명시)
[[redirects]]
  from = "/api/leads"
  to   = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/content"
  to   = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to   = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/stats"
  to   = "/.netlify/functions/stats"
  status = 200

# 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    # 다른 사이트가 이 페이지를 iframe 으로 감싸 신청 버튼을 가로채는 공격(클릭재킹) 차단
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    # HTTPS 강제 (1년) — 중간자 공격 방어
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # 쓰지 않는 브라우저 기능 차단
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # 외부 스크립트 주입·폼 탈취 차단. 폰트(jsdelivr) 외 외부 리소스는 모두 거부
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"

# 신청 데이터가 오가는 API 는 캐시 금지
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"

# 어드민 페이지는 캐시/색인 금지
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, nofollow"
